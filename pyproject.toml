[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keppy"
version = "0.1.0"
description = "Python N-body orbital mechanics library — a reimplementation of keplerpp"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
keppy = "keppy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]
viz = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["keppy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
